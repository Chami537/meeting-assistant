# The minutes/summary API next to a transcription service, on a private network. The image is built elsewhere
# (backend/Dockerfile); from the directory holding this file:
#
#     docker compose up -d
#
# minutes.env (mode 600, not in git) holds the LLM settings, as backend/.env names them: LLM_API, LLM_PROVIDER,
# LLM_MODEL, LLM_EFFORT, LLM_MAX_OUTPUT_TOKENS, and (for LLM_API=anthropic) ANTHROPIC_BASE_URL /
# ANTHROPIC_AUTH_TOKEN or ANTHROPIC_API_KEY. Set ASR_QWEN_URL to your transcription service (see below).
name: meeting-minutes

services:
  minutes-api:
    image: minutes-api:1
    container_name: meeting-minutes-api
    ports:
      - "8021:8000"
    env_file: minutes.env
    environment:
      # The transcription service /v1/minutes and /meeting/parse jobs talk to (its /v1/audio/transcriptions/jobs
      # job API); set it to your service, e.g. the one asr_service/ runs on port 8020
      ASR_QWEN_URL: ${ASR_QWEN_URL:-http://127.0.0.1:8020}
      # The meetings page's jobs (/meeting/parse, /meeting/status), kept in this SQLite file; unset to disable
      MEETING_PARSE_DB: /data/meeting_jobs.sqlite3
    volumes:
      - meeting-jobs:/data  # jobs survive a restart: the page's backend polls them again
    restart: unless-stopped
    healthcheck:  # no curl in the slim image
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  meeting-jobs:
