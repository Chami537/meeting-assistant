[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-assistant"
version = "0.1.0"
description = "AI meeting assistant: WeChat KF intake, meeting Worker orchestration, ASR + LLM minutes"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",  # sync driver for Alembic (asyncpg cannot run multi-statement SQL)
  "alembic>=1.13",
  "httpx>=0.27",
  "cryptography>=42",
  "defusedxml>=0.7",  # callback bodies are untrusted XML
  "anthropic>=1.13,<2",  # LLM_API=anthropic (Claude minutes); <2: 2.x renamed error classes, not yet adapted
  "pypinyin>=0.51",  # proofreading: does a misheard word sound like the glossary term
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "python-multipart>=0.0.9"]  # multipart: asr_service tests

[tool.setuptools.packages.find]
where = ["backend", "shared"]
include = ["app*", "meeting_protocol*"]

[tool.setuptools.package-data]
app = ["postprocess/skills/*/SKILL.md", "postprocess/glossary.csv"]  # the minutes prompt, the glossary

[tool.pytest.ini_options]
pythonpath = [".", "backend", "shared", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["db: needs PostgreSQL 16 (set TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["ragflow"]  # files of the company's RAGFlow, in its style

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # inline SQL fixtures
